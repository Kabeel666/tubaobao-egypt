<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>توباباو مصر | TuBaoBao Egypt — مصنع بديل الخشب والرخام PVC</title>
  <meta name="description" content="مصنع توباباو، قطعة 37 المنطقة الصناعية الخامسة، مدينة 6 أكتوبر. شرائح تجاليد PVC 16 و18 و20×280 سم، وألواح 1.22×2.80 بسمك 5 مم."/>
  <meta name="theme-color" content="#1b2430"/>
  <link rel="icon" href="rabbit.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="bar"></div>
  <header class="top"><div class="wrap top-in">
    <a class="brand" href="#home">
      <img src="rabbit.svg" alt="TuBaoBao"/>
      <span id="brandName">توباباو مصر<small>TuBaoBao Egypt · مصنع 6 أكتوبر</small></span>
    </a>
    <nav class="nav" id="nav"></nav>
  </div></header>
  <section class="hero" id="home">
    <div class="wrap hero-in">
      <div>
        <p class="k" id="heroK"></p>
        <h1 id="heroT"></h1>
        <p id="heroS"></p>
        <a class="btn gold" href="#products" id="cta1"></a>
        <a class="btn ghost lite" href="#contact" id="cta2"></a>
        <div class="stats" id="stats"></div>
      </div>
      <div class="hero-art">
        <div class="board" id="palette"></div>
        <img class="mark" src="rabbit.svg" alt=""/>
      </div>
    </div>
  </section>
  <section class="about sec" id="about"><div class="about-card"><h2 id="aboutT"></h2><p id="aboutP"></p></div></section>
  <section class="sec" id="products"><div class="wrap"><h2 id="prodT"></h2><p class="lead" id="prodS"></p><div class="grid3" id="lines"></div></div></section>
  <section class="sec paper" id="colors"><div class="wrap"><h2 id="colT"></h2><p class="lead" id="colS"></p><div class="filters" id="filters"></div><div class="grid4" id="finishes"></div><p class="note" id="colNote"></p></div></section>
  <section class="sec" id="sheets"><div class="wrap"><h2 id="shT"></h2><p class="lead" id="shS"></p><div class="grid4" id="sheetsG"></div></div></section>
  <section class="sec paper" id="spaces"><div class="wrap"><h2 id="spT"></h2><p class="lead" id="spS"></p><div class="grid4" id="spacesG"></div></div></section>
  <section class="sec" id="specs"><div class="wrap"><h2 id="spxT"></h2><p class="lead" id="spxS"></p><div class="grid2"><div class="scroll"><table id="specTable"></table></div><div class="scroll"><table id="profTable"></table></div></div></div></section>
  <section class="sec paper" id="calc"><div class="wrap"><h2 id="calcT"></h2><p class="lead" id="calcS"></p><div class="calc"><div><label id="lbW"></label><input id="wallW" type="number" step="0.1" value="4"/><label id="lbH"></label><input id="wallH" type="number" step="0.1" value="2.8"/><label id="lbSz"></label><select id="slatW"><option value="0.16">16 سم</option><option value="0.18">18 سم</option><option value="0.20">20 سم</option></select><p class="note" id="calcNote"></p></div><div class="result"><div id="resA"></div><div id="resP"></div><div id="resS"></div></div></div></div></section>
  <section class="sec" id="install"><div class="wrap"><h2 id="insT"></h2><p class="lead" id="insS"></p><div id="steps"></div></div></section>
  <section class="sec paper" id="compare"><div class="wrap"><h2 id="cmpT"></h2><p class="lead" id="cmpS"></p><div class="scroll"><table id="cmpTable"></table></div></div></section>
  <section class="sec" id="trade"><div class="wrap"><h2 id="trT"></h2><p class="lead" id="trS"></p><div class="grid3" id="tradeG"></div></div></section>
  <section class="sec paper" id="factory"><div class="wrap"><h2 id="facT"></h2><p class="lead" id="facP"></p><div class="grid3" id="facG"></div></div></section>
  <section class="sec" id="faq"><div class="wrap"><h2 id="faqT"></h2><div id="faqG"></div></div></section>
  <section class="sec paper" id="contact"><div class="wrap contact"><h2 id="ctT"></h2><p class="lead" id="ctS"></p><p class="note" id="ctNote"></p><p id="addr" class="addr"></p><p id="hours"></p></div></section>
  <footer><img src="rabbit.svg" alt=""/><p id="foot"></p></footer>
  <script src="app.js"></script>
</body>
</html>
